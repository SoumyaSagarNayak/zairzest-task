<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Zairza Page</title>
    <link rel="stylesheet" href="stylelog.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>Experience the Future Tech with <span>zairza</span></h1>
            <p>Release all your stress with the exciting Tech and Fun events in the most awaited fest. Zairfest 2.0 presented by Zairza.</p>
            <div class="dots">
<div></div>
<div></div>
<div></div>

                <span class="dot white"></span>
                <span class="dot pink"></span>
                <span class="dot purple"></span>
            </div>
        </div>
        <div class="right-section">
            <h2>Experience the Future Tech</h2>
            <p>Sign in to get into Zairzest </p>
            <form>
                <!-- <input type="text" placeholder="Name"> -->
                <input type="email" placeholder="Email here">
               <input type="password"   placeholder="Password                                                          &#128065">
                <p>Don't remember password? <a href="#">Reset Password</a></p>
                <p>Not a member yet? <a href="indexsignup.html">Sign up</a></p>
                <div class="button-group">
                    <button class="btn signup" onclick="handleLogin()">Login</button>
                    <span class="or">or</span>
                    <button class="btn google">Sign in with<img src="https://upload.wikimedia.org/wikipedia/commons/0/09/IOS_Google_icon.png" alt="Google" width="20"></button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function handleLogin() {
            // Get form values
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;
            
            // Simple validation
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            // Simple email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }
            
            // Simulate login process
            const loginBtn = document.querySelector('.btn.signup');
            const originalText = loginBtn.textContent;
            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;
            
            setTimeout(() => {
                // Store login status
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                
                // Redirect to landing page
                window.location.href = 'landing.html';
            }, 1500);
        }
        
        // Check if user is already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'landing.html';
        }
    </script>
</body>
</html>
