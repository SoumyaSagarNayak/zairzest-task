<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zairza Technical Society Login Page">
  <meta name="keywords" content="Zairza, OUTR, Technical Society, Robotics, Software, Design">
  <meta name="author" content="Zairza Technical Society">
  <title>Zairza Technical Society - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>
  <header class="header">
    <div class="container">
      <img src="assets/logo.png" alt="Zairza Logo" class="logo">
      <nav class="navbar">
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="landing.html">About</a></li>
          <li>
            <select id="language-select" class="language-dropdown">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="or">Odia</option>
            </select>
          </li>
          <li><button id="theme-toggle" class="theme-toggle">Toggle Theme</button></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="main">
    <section class="login-section">
      <div class="container">
        <div class="login-card">
          <h2>Login to Zairza</h2>
          <form id="login-form" class="login-form">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Zairza Technical Society. All rights reserved.</p>
    </div>
  </footer>
  <script>
    (function() {
      const popup = document.createElement("div");
      popup.innerHTML = "Generated by <strong>GenZai.in</strong>";
      Object.assign(popup.style, {
        position: "fixed",
        bottom: "20px",
        left: "20px",
        backgroundColor: "rgba(0, 0, 0, 0.7)",
        color: "#fff",
        padding: "8px 12px",
        borderRadius: "8px",
        fontSize: "14px",
        zIndex: "1000",
        boxShadow: "0 4px 8px rgba(0, 0, 0, 0.2)",
        opacity: "0",
        transform: "translateY(10px)",
        transition: "opacity 0.5s ease, transform 0.5s ease"
      });
      document.body.appendChild(popup);
      requestAnimationFrame(() => {
        popup.style.opacity = "1";
        popup.style.transform = "translateY(0)";
      });
      setTimeout(() => {
        popup.style.opacity = "0";
        popup.style.transform = "translateY(10px)";
        setTimeout(() => popup.remove(), 500);
      }, 5000);
    })();
  </script>
  <script src="scripts/script.js"></script>
</body>
</html>
