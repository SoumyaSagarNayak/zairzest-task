<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zairza Technical Society - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="public/images/image.png" type="image/png">
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <img src="public/images/image.png" alt="Zairza Logo" class="logo">
                    <span class="brand-text">Zairza</span>
                </div>
                
                <div class="nav-controls">
                    <!-- Language Dropdown -->
                    <div class="language-dropdown">
                        <button class="language-btn" id="languageBtn">
                            <span class="language-text">EN</span>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 12 12">
                                <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none"/>
                            </svg>
                        </button>
                        <div class="language-menu" id="languageMenu">
                            <div class="language-option" data-lang="en">
                                <span class="flag">🇺🇸</span>
                                <span>English</span>
                            </div>
                            <div class="language-option" data-lang="hi">
                                <span class="flag">🇮🇳</span>
                                <span>हिंदी</span>
                            </div>
                            <div class="language-option" data-lang="od">
                                <span class="flag">🏛️</span>
                                <span>ଓଡ଼ିଆ</span>
                            </div>
                        </div>
                    </div>

                    <!-- Theme Toggle -->
                    <div class="theme-toggle">
                        <input type="checkbox" id="themeToggle" class="theme-checkbox">
                        <label for="themeToggle" class="theme-label">
                            <div class="theme-slider">
                                <div class="theme-icon sun-icon">☀️</div>
                                <div class="theme-icon moon-icon">🌙</div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-header">
                        <img src="public/images/image.png" alt="Zairza Logo" class="login-logo">
                        <h1 class="login-title">Welcome to Zairza</h1>
                        <p class="login-subtitle">Technical Society of OUTR</p>
                    </div>

                    <form class="login-form" id="loginForm">
                        <div class="form-group">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" name="username" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-input" required>
                        </div>

                        <button type="submit" class="login-btn">
                            <span class="btn-text">Sign In</span>
                            <div class="btn-loader" id="loginLoader">
                                <div class="spinner"></div>
                            </div>
                        </button>
                    </form>

                    <div class="login-footer">
                        <p>Don't have an account? <a href="indexsignup.html" class="signup-link">Sign up</a></p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 Zairza Technical Society. All rights reserved.</p>
        </footer>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <div class="modal-content">
                <div class="success-icon">✅</div>
                <h3>Login Successful!</h3>
                <p>Redirecting to dashboard...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
