<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Zairza Landing Page</title>
    <link rel="stylesheet" href="stylesignup.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>Experience the Future Tech with <span>zairza</span></h1>
            <p>Release all your stress with the exciting Tech and Fun events in the most awaited fest. Zairfest 2.0 presented by Zairza.</p>
            <div class="dots">
<div></div>
<div></div>
<div></div>

                <span class="dot white"></span>
                <span class="dot pink"></span>
                <span class="dot purple"></span>
            </div>
        </div>
        <div class="right-section">
            <h2>Experience the Future Tech</h2>
            <p>Register for Zairfest 2.0 </p>
            <form onsubmit="handleSignup(event)">

                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email here">
               <input type="password"   placeholder="Password                                                          &#128065">
                <p>Already a Member Yet? <a href="index.html">Sign In</a></p>
                <div class="button-group">
                    <button class="btn signup" onclick="handleSignup()">Sign Up</button>
                    <span class="or">or</span>
                    <button class="btn google">Sign up with <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/IOS_Google_icon.png" alt="Google" width="20"></button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function handleSignup() {
            // Get form values
            const name = document.querySelector('input[type="text"]').value;
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;
            
            // Simple validation
            if (!name || !email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            // Simple email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }
            
            // Password strength validation
            if (password.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            // Simulate signup process
            const signupBtn = document.querySelector('.btn.signup');
            const originalText = signupBtn.textContent;
            signupBtn.textContent = 'Signing up...';
            signupBtn.disabled = true;
            
            setTimeout(() => {
                // Store user data
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', name);
                
                alert('Account created successfully! Welcome to Zairza!');
                
                // Redirect to landing page
                window.location.href = 'landing.html';
            }, 1500);
        }
        
        // Check if user is already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'landing.html';
        }
    </script>
</body>
</html>
